<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI French poem generator</title>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1>AI French Poem Generator</h1>
        </header>
        <main>
            <div class="form-container">
                <form id="poem-generator-form">
                    <input type="text" placeholder="Enter the topic of a french poem" autofocus required
                        autocomplete="off" class="instructions" id="user-instructions" />
                    <input type="submit" class="submit-button">
                </form>
                <div class="hint">i.e: Flowers, Paris or Cheese</div>
            </div>
            <div class="poem hidden" id="poem">
            </div>
        </main>

        <footer>
            This AI project was coded by <a href="https://github.com/EvaMothapo" target="_blank">Eva Mothapo</a> and is
            <a href="https://github.com/EvaMothapo/french-poem-generator" targert="_blank">open-sourced on Github</a>
            and
            is hosted by <a href="https://french-poem-generator-blue.vercel.app/">Vercel</a>
        </footer>
    </div>
    <script src="src/app.js"></script>
</body>

</html>
